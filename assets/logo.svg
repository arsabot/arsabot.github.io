<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente violeta a magenta -->
    <linearGradient id="violetGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A154B" />
      <stop offset="40%" stop-color="#7B2CBF" />
      <stop offset="75%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#E056FD" />
    </linearGradient>

    <!-- Gradiente para el texto secundario / sutil -->
    <linearGradient id="textDevGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#E056FD" />
    </linearGradient>

    <!-- Filtro de resplandor sutil (glow) -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: transparent; }
    .brand-bold {
      font-family: 'Montserrat', 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 86px;
      letter-spacing: 5px;
      fill: #FFFFFF;
    }
    .brand-dev {
      font-family: 'Montserrat', 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 86px;
      letter-spacing: 5px;
      fill: url(#textDevGradient);
    }
    .brand-tagline {
      font-family: 'Montserrat', 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 12px;
      fill: #A0A0B5;
    }
    .symbol-stroke {
      stroke: url(#violetGradient);
      stroke-width: 22;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <!-- Símbolo Isotipo: AR geométrico estilizado con cortes angulares tipo código -->
  <g transform="translate(40, 20)" filter="url(#subtleGlow)">
    <!-- Letra A base / Trapecio exterior -->
    <path class="symbol-stroke" d="M 120 310 L 220 90 L 320 310" />

    <!-- Travesaño dinámico / Enlace tech -->
    <path class="symbol-stroke" d="M 160 235 L 265 235" />

    <!-- Formación estilizada de la R conectada -->
    <path class="symbol-stroke" d="M 220 160 L 290 160 C 330 160 330 220 290 220 L 240 220" />
    <path class="symbol-stroke" d="M 270 220 L 325 310" />

    <!-- Acento tipo corchete web inferior -->
    <path class="symbol-stroke" d="M 100 310 L 80 310" stroke-width="16" />
    <path class="symbol-stroke" d="M 340 310 L 360 310" stroke-width="16" />
  </g>

  <!-- Texto tipográfico: ARSA.DEV -->
  <g transform="translate(480, 205)">
    <text class="brand-bold" x="0" y="0">ARSA<tspan class="brand-dev">.DEV</tspan></text>
    <text class="brand-tagline" x="4" y="52">PROFESSIONAL WEB DEVELOPMENT</text>
  </g>
</svg>
